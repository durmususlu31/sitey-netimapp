services:
  postgres:
    image: postgres:16-alpine
    container_name: site-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-site_management}
      POSTGRES_USER: ${POSTGRES_USER:-siteadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
